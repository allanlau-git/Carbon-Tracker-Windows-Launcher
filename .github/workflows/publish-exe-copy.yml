name: Publish executable copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-exe-copy.yml'
      - 'cmd/**'
      - 'assets/**'
      - 'tools/**'
      - 'build.ps1'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build executable and embed icon
        shell: pwsh
        run: ./build.ps1 -Version 4.4.0

      - name: Commit executable copy
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/CarbonTrackerLauncher-v4.4.0.exe

          if (git diff --cached --quiet) {
            Write-Host "Executable copy is already current."
            exit 0
          }

          git commit -m "build: publish Carbon Tracker launcher executable [skip ci]"
          git push origin HEAD:main
